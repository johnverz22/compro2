<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
  <h1 th:text="${title}"> Hello World</h1>
  <table border="1">
      <tr>
          <th>ID</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Age</th>
          <th>Address</th>
      </tr>
      <tr th:each="student : ${students}">
          <td th:text="${student.id}"></td>
          <td th:text="${student.firstName}"></td>
          <td th:text="${student.lastName}"></td>
          <td th:text="${student.age}"></td>
          <td th:text="${student.address}"></td>
      </tr>
  </table>
</body>
</html>
