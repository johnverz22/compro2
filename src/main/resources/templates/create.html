<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Student</title>
</head>
<body>
<h1>New Student</h1>
<div>
    <form action="/save" method="POST">
        <div>
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="firstName" required>
        </div>
        <div>
            <label for="mname">Middle Name</label>
            <input type="text" id="mname" name="middleName">
        </div>
        <div>
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" required>
        </div>
        <div>
            <label for="suffix">Suffix</label>
            <input type="text" id="suffix" name="suffix">
        </div>
        <div>
            <label>Gender</label>
            <!--    radio button or select list-->
            <!--                <select name="gender" id="gender">-->
            <!--                    <option value="Male">Male</option>-->
            <!--                    <option value="Female">Female</option>-->
            <!--                </select>-->
            <input type="radio" id="genderMale" name="gender" value="Male" checked>
            <label for="genderMale">Male</label>
            <input type="radio" id="genderFemale" name="gender" value="Female">
            <label for="genderFemale">Female</label>
        </div>
        <div>
            <label for="bday">Birth Day</label>
            <input type="date" id="bday" name="birthDay" required>
        </div>
        <div>
            <label for="level">Year Level</label>
            <select name="level" id="level">
                <option th:each="level:${levels}"
                        th:value="${level}"
                        th:text="'Year ' + ${level}"
                ></option>
            </select>

        </div>
        <div>
            <label for="address">Address</label>
            <textarea id="address" name="address" rows="2" cols="20"></textarea>
        </div>
        <button>Save</button>
    </form>

</div>
</body>
</html>
