<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1>List of Students</h1>

    <a href="/new" class="button">Register New Students</a>
    <a href="/logout" style="float: right;">Log Out</a>
    <form>
        <input type="text" name="search" placeholder="Search...">
        <button type="submit">Search</button>
    </form>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>No.</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Birth Day</th>
                <th>Address</th>
                <th>Gender</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="student, stat : ${students}">
                <td>[[${stat.count}]]</td>
                <td th:text="${student.firstName}"></td>
                <td th:text="${student.lastName}"></td>
                <td th:text="${student.birthDay}"></td>
                <td th:text="${student.address}"></td>
                <td th:text="${student.gender}"></td>
                <td class="actions">
                    <a th:href="@{/student/{id}(id=${student.id})}" class="button view">View</a>
                    <a th:href="@{/edit(id=${student.id})}" class="button edit">Edit</a>
                    <a th:href="@{/delete(id=${student.id})}" class="button delete" style="background:#e11d48;">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
