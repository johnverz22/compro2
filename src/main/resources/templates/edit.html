<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit [[${student.fullName}]]</title>
</head>
<body>
<h1 th:text="'Edit ' + ${student.fullName}"></h1>
<div>
    <form action="/update" method="POST">
        <input type="hidden" name="id"  th:value="${student.id}">
        <div>
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="firstName" th:value="${student.firstName}" required>
        </div>
        <div>
            <label for="mname">Middle Name</label>
            <input type="text" id="mname" name="middleName" th:value="${student.middleName}">
        </div>
        <div>
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" required th:value="${student.lastName}">
        </div>
        <div>
            <label for="suffix">Suffix</label>
            <input type="text" id="suffix" name="suffix" th:value="${student.suffix}">
        </div>
        <div>
            <label>Gender</label>
            <select name="gender" id="gender">
                <option value="Male" th:selected="${student.gender == 'Male'}">Male</option>
                <option value="Female" th:selected="${student.gender == 'Female'}">Female</option>
            </select>
            <!--                Elvis operator  ?:   -->
            <!--                <input type="radio" id="genderMale" name="gender" value="Male" th:checked="${(student.gender ?: 'Male') == 'Male'}">-->
            <!--                <label for="genderMale">Male</label>-->
            <!--                <input type="radio" id="genderFemale" name="gender" value="Female" th:checked="${(student.gender ?: 'Male') == 'Female'}">-->
            <!--                <label for="genderFemale">Female</label>-->
        </div>
        <div>
            <label for="bday">Birth Day</label>
            <input type="date" id="bday" name="birthDay" required th:value="${student.birthDate}">
        </div>

        <div>
            <label for="level">Year Level</label>
            <select name="level" id="level">
                <option th:each="level:${levels}"
                        th:value="${level}"
                        th:text="'Year ' + ${level}"
                        th:selected="${level == student.level}"></option>
            </select>

        </div>

        <div>
            <label for="address">Address</label>
            <textarea id="address" name="address" rows="2" cols="20" th:value="${student.address}"></textarea>
        </div>
        <button>Edit</button>
    </form>

</div>
</body>
</html>
